<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/puzzle.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <title>Puzzle Log</title>
    <script>
      // Follow the device's light/dark setting. Runs before the app loads, so there's no
      // flash of the wrong theme. shadcn/ui's dark styles key off the `dark` class.
      const darkMedia = matchMedia('(prefers-color-scheme: dark)');
      const applyTheme = () => document.documentElement.classList.toggle('dark', darkMedia.matches);
      applyTheme();
      darkMedia.addEventListener('change', applyTheme);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
